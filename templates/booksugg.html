{% load static %} {% include "header.html" %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Recommendation</title>

    <link rel="stylesheet" href="{% static 'style.css' %}" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(135deg, #f8f9fa, #eef2f3);
        min-height: 100vh;
      }

      .search-box {
        max-width: 550px;
        margin: 100px auto;
        padding: 25px;
        background: #ffffff;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      }

      .book-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 25px;
        padding: 30px;
      }

      .book-card {
        background: #ffffff;
        padding: 20px;
        border-radius: 15px;
        transition: all 0.3s ease;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      .book-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
      }

      .book-card img {
        width: 120px;
        height: 170px;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 12px;
      }

      .book-card h5 {
        font-size: 18px;
        color: #333;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .book-card p {
        font-size: 14px;
        color: #555;
      }
    </style>
  </head>

  <body>
    <!-- Search box -->
    <div class="search-box">
      <form action="{% url 'recommanded' %}" method="post">
        {% csrf_token %}
        <input
          type="text"
          name="user_input"
          class="form-control form-control-lg mb-3"
          placeholder="Search Book Name or Title"
        />

        <div class="d-grid">
          <button class="btn btn-warning btn-lg" type="submit">Search</button>
        </div>
      </form>
    </div>

    <!-- Book card grid -->
    <div class="container">
      <div class="book-grid">
        {% if data %} {% for item in data %}
        <div class="book-card">
          <img src="{{ item.2 }}" alt="Book Image" />

          <h5>{{ item.0 }}</h5>
          <p>{{ item.1 }}</p>
        </div>
        {% endfor %} {% else %} {% endif %}
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
