{% include "header.html" %} {% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book suggestion</title>
    <link rel="stylesheet" href="{% static 'style.css' %}" />
    <script src="{% static 'script.js' %}"></script>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="booksearch">
      <form action="{% url 'recommanded' %}" method="post">
        {% csrf_token %}
        <input
          style="border-radius: 5px; width: 100%; text-align: center"
          type="text"
          name="user_input"
          placeholder="Search Your Book Name and Title"
        />
        <input type="submit" class="btn btn-lg btn-warning" />
      </form>
    </div>
    <div class="moviecard">
      {% if data %} {% for item in data %}
      <div class="inner">
        <img
          id="clickableImage"
          src="{{ item.2 }}"
          alt="Book Image"
          style="width: 100px; height: auto"
        />
        <h4 style="color: black">{{ item.0 }}</h4>
        <!-- Book Title -->
        <p>{{ item.1 }}</p>
        {% comment %}
        <p>{{ item.3}}</p>
        {% endcomment %}
        <!-- Book Author -->
      </div>
      {% endfor %} {% else %}
      <p>No book suggestions available.</p>
      {% endif %}
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
