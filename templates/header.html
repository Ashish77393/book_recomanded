{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Books-Recomanded-System</title>
    <link rel="stylesheet" href="{% static 'style.css'%}" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      /* Header Styles */
      .header {
        background: linear-gradient(90deg, #4b6cb7, #182848);
        color: #fff;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        z-index: 1030;
      }
      .header a.nav-link {
        color: #fff;
        font-weight: 500;
        transition: color 0.3s, transform 0.2s;
      }
      .header a.nav-link:hover {
        color: #ffd700; /* Gold highlight */
        transform: scale(1.05);
      }
      .header a.nav-link.active {
        border-bottom: 2px solid #ffd700;
      }
      .header span.fs-4 {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        letter-spacing: 1px;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid header fixed-top">
      <header
        class="d-flex flex-wrap justify-content-between align-items-center py-3 px-4"
      >
        <a
          href="/"
          class="d-flex align-items-center mb-3 mb-md-0 text-decoration-none"
        >
          <span class="fs-4"><i>Books-Recomanded-System</i></span>
        </a>

        <ul class="nav nav-pills">
          <li class="nav-item">
            <a href="{% url 'home' %}" class="nav-link active">Home</a>
          </li>
          <li class="nav-item">
            <a href="{% url 'recommanded' %}" class="nav-link"
              >Booksuggestion</a
            >
          </li>
          <li class="nav-item">
            <a href="https://github.com/Ashish77393" class="nav-link"
              >Git&Github</a
            >
          </li>
          <li class="nav-item">
            <a href="{% url 'aboutus' %}" class="nav-link">About</a>
          </li>
        </ul>
      </header>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
